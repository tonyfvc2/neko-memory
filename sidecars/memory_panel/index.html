<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>猫猫的记忆 · Neko Memory v1.1</title>
<style>
  :root, body[data-theme="cosmos"] {
    --bg: #03060f;
    --bg-elev: rgba(11, 18, 36, 0.78);
    --panel: rgba(13, 21, 41, 0.84);
    --panel-solid: #0d1529;
    --panel-soft: rgba(18, 28, 54, 0.72);
    --border: rgba(115, 160, 255, 0.18);
    --border-strong: rgba(130, 185, 255, 0.34);
    --text: #eef4ff;
    --muted: #8ea4c9;
    --accent: #6da8ff;
    --accent2: #a78bfa;
    --primary-btn: linear-gradient(135deg, #2563eb, #3b82f6);
    --primary-btn-hover: linear-gradient(135deg, #1d4ed8, #2563eb);
    --danger: #f87171;
    --good: #34d399;
    --warn: #fbbf24;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    --glass-blur: blur(18px);
    --pill-bg: rgba(9, 15, 31, 0.82);
    --input-bg: rgba(8, 13, 28, 0.88);
    --is-dark: 1;
  }

  body[data-theme="glass"] {
    --bg: #0c1428;
    --bg-elev: rgba(255, 255, 255, 0.08);
    --panel: rgba(20, 32, 62, 0.62);
    --panel-solid: #162344;
    --panel-soft: rgba(255, 255, 255, 0.09);
    --border: rgba(255, 255, 255, 0.22);
    --border-strong: rgba(255, 255, 255, 0.38);
    --text: #f8fafc;
    --muted: #b8c9e8;
    --accent: #38bdf8;
    --accent2: #c084fc;
    --primary-btn: linear-gradient(135deg, #0ea5e9, #6366f1);
    --primary-btn-hover: linear-gradient(135deg, #0284c7, #4f46e5);
    --danger: #fb7185;
    --good: #4ade80;
    --warn: #facc15;
    --shadow: 0 18px 46px rgba(6, 12, 34, 0.5);
    --glass-blur: blur(22px);
    --pill-bg: rgba(15, 25, 52, 0.72);
    --input-bg: rgba(14, 24, 50, 0.68);
    --is-dark: 1;
  }

  body[data-theme="paper"] {
    --bg: #f6f2e9;
    --bg-elev: rgba(255, 253, 248, 0.92);
    --panel: rgba(255, 252, 245, 0.94);
    --panel-solid: #fffdf8;
    --panel-soft: rgba(242, 234, 220, 0.85);
    --border: rgba(139, 108, 72, 0.22);
    --border-strong: rgba(139, 108, 72, 0.42);
    --text: #2c221a;
    --muted: #766452;
    --accent: #3b6ea5;
    --accent2: #b45309;
    --primary-btn: linear-gradient(135deg, #2563eb, #3b82f6);
    --primary-btn-hover: linear-gradient(135deg, #1d4ed8, #2563eb);
    --danger: #dc2626;
    --good: #059669;
    --warn: #d97706;
    --shadow: 0 14px 36px rgba(72, 52, 28, 0.14);
    --glass-blur: blur(14px);
    --pill-bg: rgba(255, 252, 245, 0.9);
    --input-bg: rgba(255, 255, 255, 0.96);
    --is-dark: 0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body[data-theme="glass"] {
    background:
      radial-gradient(960px 640px at 14% 12%, rgba(56, 189, 248, 0.24), transparent 60%),
      radial-gradient(840px 580px at 86% 82%, rgba(168, 85, 247, 0.24), transparent 60%),
      #0c1428;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 14px;
    background: var(--panel);
    backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 30;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .brand-orb {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    background: radial-gradient(circle at 30% 30%, #93c5fd, #6366f1 55%, #312e81);
    box-shadow: 0 0 18px rgba(99, 102, 241, 0.45);
    display: grid;
    place-items: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .ver-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(109, 168, 255, 0.16);
    border: 1px solid var(--border-strong);
    color: var(--accent);
  }
  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 3px;
  }
  .nav-tab {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active {
    background: rgba(96, 165, 250, 0.18);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(125, 180, 255, 0.34);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-switch {
    display: flex;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .theme-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .theme-btn.active {
    background: rgba(109, 168, 255, 0.22);
    color: var(--text);
    font-weight: 600;
  }

  /* Generic Controls */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 1px solid var(--border);
    background: var(--pill-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    border-color: rgba(96, 165, 250, 0.45);
    background: var(--primary-btn);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.28);
  }
  .btn-primary:hover { background: var(--primary-btn-hover); }
  .btn-danger { color: var(--danger); border-color: rgba(248, 113, 113, 0.32); }
  .btn-danger:hover { background: rgba(248, 113, 113, 0.14); }
  .btn-pill { border-radius: 999px; }
  .btn-sm { padding: 4px 9px; font-size: 11px; border-radius: 8px; }
  .btn.active-toggle {
    background: rgba(96, 165, 250, 0.22);
    border-color: rgba(130, 185, 255, 0.55);
    color: #fff;
  }
  body[data-theme="paper"] .btn.active-toggle { color: var(--accent); }

  input, select, textarea {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109, 168, 255, 0.14);
  }
  select option { background: var(--panel-solid); color: var(--text); }

  /* Panels Container */
  .view-panel { display: none; flex: 1; min-height: 0; position: relative; }
  .view-panel.active { display: flex; flex-direction: column; }

  /* ==================== TAB 1: COSMIC STAR MAP ==================== */
  .starmap-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #02050c;
  }
  body[data-theme="glass"] .starmap-stage {
    background: radial-gradient(circle at 50% 45%, #11224a, #091124 72%);
  }
  body[data-theme="paper"] .starmap-stage {
    background: radial-gradient(circle at 50% 45%, #fdfaf3, #efe7d8 85%);
  }
  #star-canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #star-canvas:active { cursor: grabbing; }

  /* Floating Top HUD */
  .hud-top {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
    z-index: 12;
    flex-wrap: wrap;
  }
  .hud-top > * { pointer-events: auto; }
  .hud-search-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--pill-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 4px 5px 4px 12px;
    box-shadow: var(--shadow);
    flex: 1;
    max-width: 440px;
    min-width: 210px;
  }
  .hud-search-wrap input {
    border: none;
    background: transparent;
    padding: 5px 4px;
    flex: 1;
    min-width: 80px;
    box-shadow: none !important;
  }
  .hud-search-btn {
    border: none;
    border-radius: 10px;
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 600;
    color: #0b132b;
    background: linear-gradient(135deg, #93c5fd, #a5b4fc);
    cursor: pointer;
    transition: all 0.16s;
    white-space: nowrap;
  }
  .hud-search-btn:hover { filter: brightness(1.08); }
  .hud-top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .hud-pill-group {
    display: inline-flex;
    align-items: center;
    background: var(--pill-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    box-shadow: var(--shadow);
  }
  .hud-pill-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.16s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .hud-pill-btn:hover { color: var(--text); }
  .hud-pill-btn.active {
    background: rgba(110, 168, 255, 0.24);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.35);
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  /* Floating Bottom HUD */
  .hud-bottom-left {
    position: absolute;
    left: 14px;
    bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    z-index: 12;
    max-width: calc(100% - 240px);
  }
  .hud-bottom-left > * { pointer-events: auto; }
  .telemetry-bar {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--pill-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 13px;
    font-size: 11.5px;
    color: var(--muted);
    box-shadow: var(--shadow);
    width: fit-content;
  }
  .telemetry-bar strong { color: var(--text); font-size: 12.5px; margin-left: 3px; }
  .legend-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--pill-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .legend-chip:hover { color: var(--text); border-color: var(--border-strong); }
  .legend-chip.active {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(96, 165, 250, 0.2);
  }

  .hud-bottom-right {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 12;
  }

  /* Floating Left Node Directory Drawer */
  .node-drawer {
    position: absolute;
    top: 64px;
    left: 14px;
    bottom: 92px;
    width: 270px;
    max-width: calc(100% - 28px);
    background: var(--panel);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    z-index: 16;
    overflow: hidden;
  }
  .node-drawer.open { display: flex; }
  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    font-weight: 700;
  }
  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .drawer-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: var(--panel-soft);
    cursor: pointer;
    transition: all 0.14s;
    font-size: 11.5px;
    line-height: 1.45;
  }
  .drawer-item:hover { border-color: var(--border-strong); }
  .drawer-item.selected { border-color: var(--accent); background: rgba(96, 165, 250, 0.16); }

  /* Floating Right Star Inspector */
  .star-inspector {
    position: absolute;
    top: 64px;
    right: 14px;
    bottom: 62px;
    width: 318px;
    max-width: calc(100% - 28px);
    background: var(--panel);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    z-index: 18;
    overflow: hidden;
  }
  .star-inspector.open { display: flex; }
  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
  }
  .insp-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .insp-content {
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 10px 12px;
  }
  .fresh-track {
    height: 6px;
    background: rgba(148, 163, 184, 0.2);
    border-radius: 999px;
    overflow: hidden;
  }
  .fresh-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
  .neighbor-chip {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 10px;
    border-radius: 10px;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 11.5px;
    transition: all 0.14s;
  }
  .neighbor-chip:hover { border-color: var(--accent); }

  /* ==================== TAB 2: MEMORY MANAGEMENT & IMPORT/EXPORT ==================== */
  .scroll-view {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .section-card {
    background: var(--panel);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-grid-top {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .filter-grid-mid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }
  .filter-actions {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
  }
  @media (max-width: 680px) {
    .filter-grid-top, .filter-grid-mid, .filter-actions, .io-grid {
      grid-template-columns: 1fr !important;
    }
    .hud-bottom-left { max-width: calc(100% - 28px); bottom: 58px; }
  }

  /* Import / Export Cards (Image 3 style) */
  .io-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .io-box {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.16s, background 0.16s;
  }
  .io-box.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.12);
  }
  .io-box h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
  .io-desc { margin: 0; font-size: 12px; color: var(--muted); }
  .io-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .io-controls select { min-width: 112px; padding: 7px 10px; }

  /* Memory List Cards */
  .mem-list { display: flex; flex-direction: column; gap: 10px; }
  .mem-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s;
  }
  .mem-card:hover { border-color: var(--border-strong); }
  .mem-card.archived { opacity: 0.62; }
  .mem-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mem-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-soft);
  }
  .mem-content {
    font-size: 13px;
    line-height: 1.62;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .mem-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }

  /* Modal (Import Preview & Memory Edit) */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 18, 0.72);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    width: 100%;
    max-width: 720px;
    max-height: 86vh;
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-body {
    padding: 14px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-foot {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .preview-summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .preview-table th, .preview-table td {
    text-align: left;
    padding: 8px 9px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .preview-table th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .act-create { color: #34d399; border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.12); }

<script>
const CAT_META = {
  preference: { label: '偏好', color: '#fbbf24', glow: '255, 205, 112', defaultHl: 365 },
  project:    { label: '项目', color: '#60a5fa', glow: '112, 185, 255', defaultHl: 60 },
  decision:   { label: '决策', color: '#a78bfa', glow: '180, 148, 255', defaultHl: 90 },
  pitfall:    { label: '踩坑', color: '#fb7185', glow: '255, 132, 160', defaultHl: 90 },
  fact:       { label: '事实', color: '#34d399', glow: '94, 234, 195',  defaultHl: 30 },
  handoff:    { label: '交接', color: '#38bdf8', glow: '96, 212, 255',  defaultHl: 14 },
  topic:      { label: '主题', color: '#93c5fd', glow: '150, 210, 255', defaultHl: 60 }
};

let currentTheme = localStorage.getItem('neko_theme') || 'cosmos';
let currentTab = 'map';
let cachedStats = { active_count: 0, archived_count: 0, total_recalls: 0, by_category: [] };
let cachedMemories = [];

// Star Map Engine State
const mapState = {
  mode: '3d', // '3d' | '2d'
  autoSpin: true,
  onlyStrongEdges: false,
  showTopics: true,
  categoryFilter: '',
  searchQuery: '',
  searchMatchIds: new Set(),
  rawNodes: [],
  rawEdges: [],
  rawTopics: [],
  rawTopicEdges: [],
  nodes: [],      // active rendered nodes (memories + optional topics)
  edges: [],      // active rendered edges
  dust: [],       // orbital stardust motes around nodes
  bgStars: [],    // deep cosmic backdrop stars
  selectedId: null,
  hoveredId: null,
  rotY: 0.35,
  rotX: 0.24,
  targetRotY: null,
  targetRotX: null,
  zoom: 1.0,
  panX: 0,
  panY: 0,
  dragging: false,
  dragMoved: false,
  lastX: 0,
  lastY: 0,
  velY: 0,
  velX: 0,
  width: 800,
  height: 540,
  dpr: 1,
  projected: new Map()
};

// Pre-rendered glowing star sprites for ultra-smooth additive bloom
const SPRITES = {};
function makeGlowSprite(size, innerRGB, midRGB, outerRGB, withCross = false) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2;
  const r = size / 2;

  const g = ctx.createRadialGradient(cx, cx, 0, cx, cx, r);
  g.addColorStop(0.0, `rgba(255, 255, 255, 1)`);
  g.addColorStop(0.14, `rgba(${innerRGB}, 0.96)`);
  g.addColorStop(0.34, `rgba(${midRGB}, 0.42)`);
  g.addColorStop(0.68, `rgba(${outerRGB}, 0.11)`);
  g.addColorStop(1.0, `rgba(${outerRGB}, 0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  if (withCross) {
    ctx.save();
    ctx.translate(cx, cx);
    for (let k = 0; k < 2; k++) {
      ctx.rotate(k === 0 ? 0 : Math.PI / 2);
      const lg = ctx.createLinearGradient(-r * 0.85, 0, r * 0.85, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(0.42, `rgba(${innerRGB}, 0.32)`);
      lg.addColorStop(0.5, 'rgba(255,255,255,0.92)');
      lg.addColorStop(0.58, `rgba(${innerRGB}, 0.32)`);
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(-r * 0.85, -1.3, r * 1.7, 2.6);
    }
    ctx.restore();
  }
  return c;
}

function initSprites() {
  SPRITES.sun = makeGlowSprite(160, '255, 240, 198', '255, 196, 108', '255, 140, 50', true);
  SPRITES.ice = makeGlowSprite(96, '220, 244, 255', '128, 196, 255', '64, 128, 255', false);
  SPRITES.topic = makeGlowSprite(96, '210, 238, 255', '104, 178, 255', '56, 130, 246', false);
  SPRITES.dust = makeGlowSprite(40, '224, 242, 255', '147, 197, 253', '96, 165, 250', false);
  for (const [k, v] of Object.entries(CAT_META)) {
    SPRITES[k] = makeGlowSprite(96, '240, 248, 255', v.glow, v.glow, false);
  }
}

function seededRand(seed) {
  let s = Math.abs(Math.floor(seed)) % 2147483647;
  if (s === 0) s = 1337;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function freshColor(pct) {
  if (pct >= 70) return '#34d399';
  if (pct >= 40) return '#fbbf24';
  return '#f87171';
}

async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function setTheme(t) {
  currentTheme = t;
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('neko_theme', t);
  ['cosmos', 'glass', 'paper'].forEach((k) => {
    document.getElementById(`th-${k}`).classList.toggle('active', k === t);
  });
}

function switchTab(t) {
  currentTab = t;
  ['map', 'list', 'recall', 'logs'].forEach((k) => {
    document.getElementById(`tab-${k}`).classList.toggle('active', k === t);
    document.getElementById(`view-${k}`).classList.toggle('active', k === t);
  });
  if (t === 'map') {
    setTimeout(resizeCanvas, 20);
  } else if (t === 'list') {
    loadList();
  } else if (t === 'logs') {
    loadLogs();
  }
}

/* ==================== STAR MAP LAYOUT & RENDERING ==================== */
function initBgStars() {
  const rnd = seededRand(20261127);
  mapState.bgStars = [];
  for (let i = 0; i < 160; i++) {
    mapState.bgStars.push({
      x: rnd(),
      y: rnd(),
      r: 0.45 + rnd() * 1.35,
      a: 0.14 + rnd() * 0.45,
      phase: rnd() * Math.PI * 2,
      speed: 0.4 + rnd() * 1.4
    });
  }
}

function rebuildStarField() {
  const memNodes = mapState.rawNodes.map((n) => ({
    ...n,
    kind: 'memory',
    key: String(n.id)
  }));
  const topicNodes = mapState.showTopics
    ? mapState.rawTopics.map((t) => ({
        ...t,
        kind: 'topic',
        category: 'topic',
        key: String(t.id),
        importance: Math.min(5, 2 + Math.floor(t.count / 2)),
        freshness_pct: 95,
        is_hub: false
      }))
    : [];

  const allNodes = [...memNodes, ...topicNodes];
  const nodeMap = new Map(allNodes.map((n) => [n.key, n]));

  let allEdges = mapState.rawEdges.map((e) => ({
    source: String(e.source),
    target: String(e.target),
    weight: e.weight,
    reason: e.reason,
    kind: 'memory'
  }));
  if (mapState.showTopics) {
    allEdges = allEdges.concat(
      mapState.rawTopicEdges.map((e) => ({
        source: String(e.source),
        target: String(e.target),
        weight: e.weight,
        reason: e.reason,
        kind: 'topic'
      }))
    );
  }
  allEdges = allEdges.filter((e) => nodeMap.has(e.source) && nodeMap.has(e.target));

  // Choose 2-3 gravitational sun hubs for organic binary/ternary galaxy clustering
  const hubs = memNodes
    .filter((n) => n.is_hub)
    .sort((a, b) => (b.degree + b.importance) - (a.degree + a.importance))
    .slice(0, 3);
  if (hubs.length === 0 && memNodes.length > 0) hubs.push(memNodes[0]);

  const hubAnchors = hubs.length === 1
    ? [{ x: 0, y: 0, z: 0 }]
    : hubs.length === 2
      ? [{ x: -86, y: -42, z: 22 }, { x: 82, y: 48, z: -20 }]
      : [{ x: -94, y: -46, z: 26 }, { x: 88, y: 44, z: -18 }, { x: 6, y: -64, z: -62 }];

  const hubPosByKey = new Map();
  const solarHubKeys = new Set();
  hubs.forEach((h, idx) => {
    const a = hubAnchors[idx];
    hubPosByKey.set(h.key, a);
    solarHubKeys.add(h.key);
  });

  // Adjacency for hub attraction
  const adj = new Map();
  for (const e of allEdges) {
    if (!adj.has(e.source)) adj.set(e.source, []);
    if (!adj.has(e.target)) adj.set(e.target, []);
    adj.get(e.source).push({ id: e.target, w: e.weight });
    adj.get(e.target).push({ id: e.source, w: e.weight });
  }

  // Deterministic 3D galaxy coordinates + 2D force coordinates
  allNodes.forEach((n, idx) => {
    const rnd = seededRand(hashStr(n.key) + 97);
    n.is_solar = solarHubKeys.has(n.key);
    if (hubPosByKey.has(n.key)) {
      const a = hubPosByKey.get(n.key);
      n.x3 = a.x;
      n.y3 = a.y;
      n.z3 = a.z;
    } else {
      // Pick strongest connected hub or category-based hub
      let anchor = hubAnchors[idx % hubAnchors.length];
      const neighbors = adj.get(n.key) || [];
      let bestW = -1;
      for (const nb of neighbors) {
        if (hubPosByKey.has(nb.id) && nb.w > bestW) {
          bestW = nb.w;
          anchor = hubPosByKey.get(nb.id);
        }
      }
      const armAngle = (idx * 2.39996) + (n.kind === 'topic' ? 0.6 : 0);
      const radius = n.kind === 'topic'
        ? 44 + rnd() * 74
        : 58 + rnd() * 136;
      const elev = (rnd() - 0.5) * 1.45;
      n.x3 = anchor.x + Math.cos(armAngle) * Math.cos(elev) * radius;
      n.y3 = anchor.y + Math.sin(elev) * radius * 0.78 + Math.sin(armAngle * 1.3) * 18;
      n.z3 = anchor.z + Math.sin(armAngle) * Math.cos(elev) * radius;
    }
    n.x2 = n.x3 * 1.25;
    n.y2 = n.y3 * 1.25;
    n.vx = 0;
    n.vy = 0;
    n.twinklePhase = rnd() * Math.PI * 2;
    n.baseSize = n.is_solar
      ? 12.2
      : (n.kind === 'topic' ? 4.8 + Math.min(2.6, (n.count || 1) * 0.45) : 4.2 + (n.importance || 3) * 0.85);
  });

  // Generate shimmering orbital stardust motes & galaxy spiral rings around the 2-3 Solar Suns
  const dust = [];
  const targetDustPerMem = allNodes.length <= 25 ? 20 : (allNodes.length <= 80 ? 9 : 3);
  for (const n of allNodes) {
    const rnd = seededRand(hashStr(n.key + ':dust'));
    if (n.is_solar) {
      // Spiral orbital ring around each Golden Solar Core (LivingMemory-inspired!)
      const ringCount = 58;
      for (let k = 0; k < ringCount; k++) {
        const frac = k / ringCount;
        const spiralAngle = frac * Math.PI * 4.2 + rnd() * 0.25;
        const orbitR = 16 + Math.pow(frac, 0.82) * 92 + (rnd() - 0.5) * 8;
        dust.push({
          parentKey: n.key,
          orbitR,
          angle: spiralAngle,
          tiltX: 0.42 + (rnd() - 0.5) * 0.28,
          tiltZ: -0.35 + (rnd() - 0.5) * 0.28,
          speed: 0.12 + (1 - frac) * 0.22,
          size: 1.35 + rnd() * 2.1,
          alpha: 0.48 + rnd() * 0.5,
          warm: frac < 0.22 && rnd() < 0.55,
          twinkle: rnd() * Math.PI * 2,
          category: n.category
        });
      }
    }
    const count = n.is_solar ? 24 : (n.kind === 'topic' ? Math.max(5, Math.floor(targetDustPerMem * 0.55)) : targetDustPerMem);
    for (let k = 0; k < count; k++) {
      const orbitR = n.is_solar ? (18 + Math.pow(rnd(), 0.72) * 112) : (10 + rnd() * 48);
      const angle = rnd() * Math.PI * 2;
      const tiltX = (rnd() - 0.5) * 1.4;
      const tiltZ = (rnd() - 0.5) * 1.4;
      const speed = (0.07 + rnd() * 0.26) * (rnd() > 0.5 ? 1 : -1);
      dust.push({
        parentKey: n.key,
        orbitR,
        angle,
        tiltX,
        tiltZ,
        speed,
        size: 1.15 + rnd() * 1.85,
        alpha: 0.36 + rnd() * 0.6,
        warm: false,
        twinkle: rnd() * Math.PI * 2,
        category: n.category
      });
    }
  }

  mapState.nodes = allNodes;
  mapState.edges = allEdges;
  mapState.dust = dust;
  mapState.nodeByKey = nodeMap;

  updateMapHudCounts();
  renderNodeDrawer();
}

function updateMapHudCounts() {
  document.getElementById('hud-total-mem').textContent = cachedStats.active_count || mapState.rawNodes.length;
  document.getElementById('hud-total-nodes').textContent = mapState.nodes.length;
  const visibleEdges = mapState.onlyStrongEdges
    ? mapState.edges.filter((e) => e.weight >= 0.32)
    : mapState.edges;
  document.getElementById('hud-total-edges').textContent = visibleEdges.length;
  document.getElementById('hud-total-recalls').textContent = cachedStats.total_recalls || 0;

  // Build category legend counts
  const counts = {};
  for (const n of mapState.nodes) {
    counts[n.category] = (counts[n.category] || 0) + 1;
  }
  const legendEl = document.getElementById('hud-legend');
  const order = ['preference', 'project', 'decision', 'pitfall', 'fact', 'handoff', 'topic'];
  legendEl.innerHTML = order
    .filter((k) => counts[k] > 0)
    .map((k) => {
      const m = CAT_META[k];
      const active = mapState.categoryFilter === k ? 'active' : '';
      return `<button class="legend-chip ${active}" onclick="toggleCategoryFilter('${k}')">
        <span class="status-dot" style="background:${m.color};box-shadow:0 0 8px ${m.color};"></span>
        <span>${m.label} · ${counts[k]}</span>
      </button>`;
    }).join('');
}

function toggleCategoryFilter(cat) {
  mapState.categoryFilter = mapState.categoryFilter === cat ? '' : cat;
  updateMapHudCounts();
}

function renderNodeDrawer() {
  const el = document.getElementById('drawer-list');
  const mems = mapState.nodes.filter((n) => n.kind === 'memory');
  document.getElementById('drawer-count').textContent = mems.length;
  if (mems.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无记忆星辰</div>';
    return;
  }
  el.innerHTML = mems.map((n) => {
    const m = CAT_META[n.category] || CAT_META.fact;
    const sel = mapState.selectedId === n.key ? 'selected' : '';
    return `<div class="drawer-item ${sel}" onclick="selectStar('${n.key}', true)">
      <span class="status-dot" style="background:${m.color};margin-top:5px;box-shadow:0 0 8px ${m.color};"></span>
      <div style="min-width:0;flex:1;">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(n.label)}</div>
        <div style="font-size:10.5px;color:var(--muted);">#${n.id} · ${m.label} · 鲜活 ${n.freshness_pct}%</div>
      </div>
    </div>`;
  }).join('');
}

function toggleNodeDrawer(force) {

function resetCamera() {

  mapState.rotX = 0.24;
  mapState.targetRotY = null;
  mapState.targetRotX = null;
  mapState.zoom = 1.0;
  mapState.panX = 0;
  mapState.panY = 0;
  mapState.velX = 0;
  mapState.velY = 0;
}

function searchStarMap() {
  const q = document.getElementById('map-search-input').value.trim().toLowerCase();
  mapState.searchQuery = q;
  mapState.searchMatchIds.clear();
  document.getElementById('map-search-clear').style.display = q ? 'inline-flex' : 'none';
  if (!q) return;

  for (const n of mapState.nodes) {
    const hay = `${n.label} ${n.content || ''} ${n.tags || ''} ${n.workspace || ''} #${n.id}`.toLowerCase();
    if (hay.includes(q)) mapState.searchMatchIds.add(n.key);
  }
  if (mapState.searchMatchIds.size === 0) {
    toast(`星图中未找到包含「${q}」的节点`);
    return;
  }
  const firstKey = Array.from(mapState.searchMatchIds)[0];
  selectStar(firstKey, true);
  toast(`在星图中高亮了 ${mapState.searchMatchIds.size} 个匹配节点 ✨`);
}

function clearMapSearch() {
  document.getElementById('map-search-input').value = '';
  mapState.searchQuery = '';
  mapState.searchMatchIds.clear();
  document.getElementById('map-search-clear').style.display = 'none';
}

function resizeCanvas() {
  const stage = document.getElementById('starmap-stage');
  const canvas = document.getElementById('star-canvas');
  if (!stage || !canvas) return;
  const rect = stage.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mapState.width = rect.width;
  mapState.height = rect.height;
  mapState.dpr = dpr;
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
}

function stepForce2D() {
  const nodes = mapState.nodes;
  const N = nodes.length;
  if (N === 0) return;
  // Gentle repulsion + spring attraction + center pull
  for (let i = 0; i < N; i++) {
    const a = nodes[i];
    a.vx += -a.x2 * 0.0014;
    a.vy += -a.y2 * 0.0014;
    for (let j = i + 1; j < N; j++) {
      const b = nodes[j];
      const dx = a.x2 - b.x2;
      const dy = a.y2 - b.y2;
      const d2 = dx * dx + dy * dy + 160;
      const f = 1400 / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f;
      const fy = (dy / d) * f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of mapState.edges) {
    const a = mapState.nodeByKey.get(e.source);
    const b = mapState.nodeByKey.get(e.target);
    if (!a || !b) continue;
    const dx = b.x2 - a.x2;
    const dy = b.y2 - a.y2;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const target = 115 - e.weight * 38;
    const k = (d - target) * 0.004 * (0.5 + e.weight);
    const fx = (dx / d) * k;
    const fy = (dy / d) * k;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  }
  for (const n of nodes) {
    n.vx *= 0.86;
    n.vy *= 0.86;
    n.x2 += n.vx;
    n.y2 += n.vy;
  }
}

function projectPoint(x3, y3, z3, cosY, sinY, cosX, sinX, cx, cy, scale) {
  const rx = x3 * cosY - z3 * sinY;
  const rz1 = x3 * sinY + z3 * cosY;
  const ry = y3 * cosX - rz1 * sinX;
  const rz = y3 * sinX + rz1 * cosX;
  const fov = 560;
  const persp = fov / (fov + rz + 230);
  return {
    sx: cx + rx * persp * scale,
    sy: cy + ry * persp * scale,
    depth: rz,
    persp
  };
}

function isNodeHighlighted(key, focusNeighbors) {
  if (mapState.searchMatchIds.size > 0) return mapState.searchMatchIds.has(key);
  if (mapState.categoryFilter) {
    const n = mapState.nodeByKey.get(key);
    return n && n.category === mapState.categoryFilter;
  }
  const focusKey = mapState.hoveredId || mapState.selectedId;
  if (focusKey) return key === focusKey || focusNeighbors.has(key);
  return true;
}

function renderStarMap(ts) {
  requestAnimationFrame(renderStarMap);
  if (currentTab !== 'map') return;
  const canvas = document.getElementById('star-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = mapState.width;
  const H = mapState.height;
  const dpr = mapState.dpr;
  const t = (ts || 0) * 0.001;
  const isPaper = currentTheme === 'paper';
  const isGlass = currentTheme === 'glass';

  if (mapState.mode === '3d') {
    if (!mapState.dragging) {
      if (mapState.targetRotY !== null) {
        mapState.rotY += (mapState.targetRotY - mapState.rotY) * 0.08;
        mapState.rotX += (mapState.targetRotX - mapState.rotX) * 0.08;
        if (Math.abs(mapState.targetRotY - mapState.rotY) < 0.005) {
          mapState.targetRotY = null;
          mapState.targetRotX = null;
        }
      } else if (mapState.autoSpin) {
        mapState.rotY += 0.0022;
      }
      mapState.rotY += mapState.velY;
      mapState.rotX = Math.max(-1.25, Math.min(1.25, mapState.rotX + mapState.velX));
      mapState.velY *= 0.92;
      mapState.velX *= 0.92;
    }
  } else {
    stepForce2D();
  }

  ctx.save();
  ctx.scale(dpr, dpr);

  // 1. Cosmic Abyssal Background + Subtle Volumetric Nebula
  if (isPaper) {
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 20, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    bg.addColorStop(0, '#fcf8ef');
    bg.addColorStop(1, '#ede4d3');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  } else {
    const bg = ctx.createRadialGradient(W * 0.52, H * 0.48, 30, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    if (isGlass) {
      bg.addColorStop(0, '#102046');
      bg.addColorStop(0.55, '#0b1530');
      bg.addColorStop(1, '#060c1c');
    } else {
      bg.addColorStop(0, '#071127');
      bg.addColorStop(0.42, '#030815');
      bg.addColorStop(1, '#010308');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Volumetric deep-blue & violet cosmic nebula clouds
    const n1x = W * 0.44 + Math.sin(t * 0.12) * 28;
    const n1y = H * 0.46 + Math.cos(t * 0.1) * 18;
    const neb1 = ctx.createRadialGradient(n1x, n1y, 10, n1x, n1y, Math.min(W, H) * 0.52);
    neb1.addColorStop(0, 'rgba(37, 99, 235, 0.13)');
    neb1.addColorStop(0.45, 'rgba(30, 58, 138, 0.06)');
    neb1.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = neb1;
    ctx.fillRect(0, 0, W, H);

    const n2x = W * 0.62 + Math.cos(t * 0.09) * 24;
    const n2y = H * 0.56 + Math.sin(t * 0.11) * 20;
    const neb2 = ctx.createRadialGradient(n2x, n2y, 10, n2x, n2y, Math.min(W, H) * 0.45);
    neb2.addColorStop(0, 'rgba(99, 102, 241, 0.11)');
    neb2.addColorStop(0.5, 'rgba(15, 118, 110, 0.04)');
    neb2.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = neb2;
    ctx.fillRect(0, 0, W, H);
  }

  // 2. Distant Twinkling Micro-Starfield
  for (const s of mapState.bgStars) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);
    ctx.fillStyle = isPaper
      ? `rgba(120, 92, 58, ${(s.a * 0.35 * tw).toFixed(3)})`
      : `rgba(186, 222, 255, ${(s.a * tw).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const cx = W * 0.5 + mapState.panX;
  const cy = H * 0.5 + mapState.panY;
  const baseScale = Math.min(W, H) / 410 * mapState.zoom;
  const cosY = Math.cos(mapState.rotY), sinY = Math.sin(mapState.rotY);
  const cosX = Math.cos(mapState.rotX), sinX = Math.sin(mapState.rotX);

  // Project all nodes
  mapState.projected.clear();
  const drawNodes = [];
  for (const n of mapState.nodes) {
    let p;
    if (mapState.mode === '3d') {
      p = projectPoint(n.x3, n.y3, n.z3, cosY, sinY, cosX, sinX, cx, cy, baseScale);
    } else {
      p = {
        sx: cx + n.x2 * baseScale * 0.85,
        sy: cy + n.y2 * baseScale * 0.85,
        depth: 0,
        persp: 1
      };
    }
    const radius = Math.max(2.6, n.baseSize * p.persp * Math.min(1.5, Math.max(0.7, mapState.zoom)));
    const item = { node: n, ...p, radius };
    mapState.projected.set(n.key, item);
    drawNodes.push(item);
  }

  // Compute focus neighbors
  const focusKey = mapState.hoveredId || mapState.selectedId;
  const focusNeighbors = new Set();
  const activeEdges = mapState.onlyStrongEdges
    ? mapState.edges.filter((e) => e.weight >= 0.32)
    : mapState.edges;
  if (focusKey) {
    for (const e of activeEdges) {
      if (e.source === focusKey) focusNeighbors.add(e.target);
      if (e.target === focusKey) focusNeighbors.add(e.source);
    }
  }
  const hasFilter = Boolean(focusKey || mapState.categoryFilter || mapState.searchMatchIds.size > 0);

  // 3. Curved Cosmic Filaments (Edges)
  ctx.save();
  if (!isPaper) ctx.globalCompositeOperation = 'lighter';
  for (const e of activeEdges) {
    const a = mapState.projected.get(e.source);
    const b = mapState.projected.get(e.target);
    if (!a || !b) continue;

    const connectedToFocus = focusKey && (e.source === focusKey || e.target === focusKey);
    const bothHi = isNodeHighlighted(e.source, focusNeighbors) && isNodeHighlighted(e.target, focusNeighbors);
    const depthFade = Math.max(0.25, Math.min(1, ((a.persp + b.persp) * 0.5 - 0.35) * 1.4));

    let alpha = (0.09 + e.weight * 0.22) * depthFade;
    let lw = 0.7 + e.weight * 0.8;
    let strokeStyle;

    if (connectedToFocus) {
      alpha = 0.72;
      lw = 1.65;
      strokeStyle = isPaper ? `rgba(37, 99, 235, ${alpha})` : `rgba(147, 210, 255, ${alpha})`;
    } else if (hasFilter && !bothHi) {
      alpha *= 0.2;
      strokeStyle = isPaper ? `rgba(120, 95, 65, ${alpha})` : `rgba(110, 165, 255, ${alpha})`;
    } else {
      strokeStyle = isPaper
        ? `rgba(105, 84, 60, ${(alpha * 0.95).toFixed(3)})`
        : `rgba(135, 192, 255, ${alpha.toFixed(3)})`;
    }

    // Subtle quadratic curve perpendicular to edge midpoint
    const mx = (a.sx + b.sx) * 0.5;
    const my = (a.sy + b.sy) * 0.5;
    const dx = b.sx - a.sx;
    const dy = b.sy - a.sy;
    const curveSign = ((hashStr(e.source + e.target) % 2) === 0 ? 1 : -1) * 0.13;
    const cpx = mx - dy * curveSign;
    const cpy = my + dx * curveSign;

    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.quadraticCurveTo(cpx, cpy, b.sx, b.sy);
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
  ctx.restore();

  // 4. Orbital Stardust Sparkles (Additive Celestial Bloom)
  ctx.save();
  if (!isPaper) ctx.globalCompositeOperation = 'lighter';
  const dustSpin = mapState.autoSpin ? t : 0;
  for (const d of mapState.dust) {
    const parent = mapState.nodeByKey.get(d.parentKey);
    if (!parent) continue;
    const ang = d.angle + dustSpin * d.speed;
    const ox = Math.cos(ang) * d.orbitR;
    const oy = Math.sin(ang) * d.orbitR * Math.cos(d.tiltX);
    const oz = Math.sin(ang) * d.orbitR * Math.sin(d.tiltZ);

    let px, py, persp;
    if (mapState.mode === '3d') {
      const pr = projectPoint(parent.x3 + ox, parent.y3 + oy, parent.z3 + oz, cosY, sinY, cosX, sinX, cx, cy, baseScale);
      px = pr.sx; py = pr.sy; persp = pr.persp;
    } else {
      px = cx + (parent.x2 + ox * 0.85) * baseScale * 0.85;
      py = cy + (parent.y2 + oy * 0.85) * baseScale * 0.85;
      persp = 1;
    }
    if (px < -30 || px > W + 30 || py < -30 || py > H + 30) continue;

    const hi = !hasFilter || isNodeHighlighted(d.parentKey, focusNeighbors);
    const tw = 0.6 + 0.4 * Math.sin(t * 2.2 + d.twinkle);
    const alpha = d.alpha * tw * Math.min(1, persp * 1.15) * (hi ? 1 : 0.16);
    const sz = Math.max(3.5, d.size * 5.2 * persp * Math.min(1.4, mapState.zoom));

    if (isPaper) {
      ctx.fillStyle = d.warm
        ? `rgba(180, 83, 9, ${(alpha * 0.5).toFixed(3)})`
        : `rgba(59, 110, 165, ${(alpha * 0.42).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.8, sz * 0.14), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      const sp = d.warm ? SPRITES.sun : SPRITES.dust;
      ctx.drawImage(sp, px - sz * 0.5, py - sz * 0.5, sz, sz);
    }
  }
  ctx.restore();

  // 5. Sort Stars Back-to-Front & Render Luminous Celestial Orbs
  drawNodes.sort((a, b) => b.depth - a.depth);
  ctx.save();
  if (!isPaper) ctx.globalCompositeOperation = 'lighter';
  for (const item of drawNodes) {
    const n = item.node;
    const meta = CAT_META[n.category] || CAT_META.fact;
    const isSel = n.key === mapState.selectedId;
    const isHov = n.key === mapState.hoveredId;
    const isSearch = mapState.searchMatchIds.has(n.key);
    const hi = !hasFilter || isNodeHighlighted(n.key, focusNeighbors);
    const pulse = 1 + 0.08 * Math.sin(t * 2.4 + n.twinklePhase);
    const freshBoost = 0.55 + 0.45 * ((n.freshness_pct || 80) / 100);

    if (isPaper) {
      ctx.globalAlpha = hi ? 0.95 : 0.22;
      ctx.beginPath();
      ctx.arc(item.sx, item.sy, item.radius * (isSel || isHov ? 1.35 : 1), 0, Math.PI * 2);
      ctx.fillStyle = meta.color;
      ctx.fill();
      if (isSel || isHov || isSearch) {
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      continue;
    }

    const alpha = (hi ? 1.0 : 0.22) * freshBoost;
    ctx.globalAlpha = Math.max(0.12, Math.min(1, alpha));

    // Golden Solar Hub (top 2-3 focal cores) vs Crystalline Ice-Blue Celestial Star
    const sprite = n.is_solar
      ? SPRITES.sun
      : (n.kind === 'topic' ? SPRITES.topic : (SPRITES[n.category] || SPRITES.ice));
    const haloMult = n.is_solar ? 9.6 : (isSel || isHov || isSearch ? 7.2 : 5.4);
    const drawSize = item.radius * haloMult * pulse;
    ctx.drawImage(sprite, item.sx - drawSize * 0.5, item.sy - drawSize * 0.5, drawSize, drawSize);

    // Extra crisp white-hot inner core
    ctx.globalAlpha = hi ? 0.96 : 0.28;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(item.sx, item.sy, Math.max(1.5, item.radius * (n.is_solar ? 0.54 : 0.36)), 0, Math.PI * 2);
    ctx.fill();

    // Selection / Search luminous ring
    if (isSel || isHov || isSearch) {
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = isSearch ? '#fde047' : (n.is_solar ? '#fde68a' : '#93c5fd');
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(item.sx, item.sy, item.radius * 1.9 + Math.sin(t * 4) * 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();

  // 6. Floating Glassmorphic Pill Labels (Smart Collision-Avoidance!)
  const labelCandidates = drawNodes
    .slice()
    .sort((a, b) => {
      const score = (it) => {
        let s = -it.depth * 0.35 + (it.node.is_hub ? 500 : 0) + (it.node.importance || 2) * 35;
        if (it.node.key === mapState.hoveredId) s += 5000;
        if (it.node.key === mapState.selectedId) s += 4000;
        if (mapState.searchMatchIds.has(it.node.key)) s += 3000;
        if (focusNeighbors.has(it.node.key)) s += 1200;
        if (it.node.kind === 'topic') s -= 40;
        return s;
      };
      return score(b) - score(a);
    });

  const placedBoxes = [];
  const maxLabels = W < 560 ? 10 : 18;
  let shownLabels = 0;

  ctx.font = '500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  for (const item of labelCandidates) {
    if (shownLabels >= maxLabels) break;
    const n = item.node;
    const forceShow = n.key === mapState.hoveredId || n.key === mapState.selectedId || mapState.searchMatchIds.has(n.key);
    if (!forceShow && hasFilter && !isNodeHighlighted(n.key, focusNeighbors)) continue;
    if (item.sx < 28 || item.sx > W - 28 || item.sy < 62 || item.sy > H - 72) continue;

    const text = n.label.length > 15 ? n.label.slice(0, 15) + '…' : n.label;
    const tw = ctx.measureText(text).width;
    const pillW = tw + 26;
    const pillH = 24;
    const px = item.sx - pillW * 0.5;
    const py = item.sy - item.radius - pillH - 6;

    // Overlap check
    const pad = 6;
    let collides = false;
    if (!forceShow) {
      for (const box of placedBoxes) {
        if (px < box.x + box.w + pad && px + pillW + pad > box.x && py < box.y + box.h + pad && py + pillH + pad > box.y) {
          collides = true;
          break;
        }
      }
    }
    if (collides) continue;
    placedBoxes.push({ x: px, y: py, w: pillW, h: pillH });
    shownLabels++;

    const meta = CAT_META[n.category] || CAT_META.fact;
    const isPriority = forceShow;

    // Rounded capsule pill
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(px, py, pillW, pillH, 12);
    if (isPaper) {
      ctx.fillStyle = isPriority ? 'rgba(255, 253, 248, 0.96)' : 'rgba(255, 252, 245, 0.84)';
      ctx.strokeStyle = isPriority ? meta.color : 'rgba(139, 108, 72, 0.32)';
    } else {
      ctx.fillStyle = isPriority ? 'rgba(13, 24, 48, 0.92)' : 'rgba(9, 16, 34, 0.78)';
      ctx.strokeStyle = isPriority ? 'rgba(147, 197, 253, 0.65)' : 'rgba(120, 168, 255, 0.28)';
    }
    ctx.lineWidth = isPriority ? 1.25 : 1;
    ctx.fill();
    ctx.stroke();

    // Colored indicator dot
    ctx.beginPath();
    ctx.arc(px + 11, py + pillH * 0.5, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = meta.color;
    ctx.fill();

    // Label text
    ctx.fillStyle = isPaper ? '#2c221a' : '#eaf2ff';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, px + 19, py + pillH * 0.5 + 0.5);
    ctx.restore();
  }

  ctx.restore();
}

function pickNode(clientX, clientY) {
  const canvas = document.getElementById('star-canvas');
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  let best = null;
  let bestDist = 26;
  for (const item of mapState.projected.values()) {
    const dx = item.sx - x;
    const dy = item.sy - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < Math.max(16, item.radius + 10) && d < bestDist) {
      best = item.node;
      bestDist = d;
    }
  }
  return best;
}

function bindCanvasEvents() {
  const canvas = document.getElementById('star-canvas');
  canvas.addEventListener('pointerdown', (e) => {
    mapState.dragging = true;
    mapState.dragMoved = false;
    mapState.lastX = e.clientX;
    mapState.lastY = e.clientY;
    mapState.targetRotY = null;
    mapState.targetRotX = null;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (mapState.dragging) {
      const dx = e.clientX - mapState.lastX;
      const dy = e.clientY - mapState.lastY;
      if (Math.abs(dx) + Math.abs(dy) > 3) mapState.dragMoved = true;
      mapState.lastX = e.clientX;
      mapState.lastY = e.clientY;
      if (mapState.mode === '3d') {
        mapState.rotY += dx * 0.0065;
        mapState.rotX = Math.max(-1.25, Math.min(1.25, mapState.rotX + dy * 0.0065));
        mapState.velY = dx * 0.0012;
        mapState.velX = dy * 0.0012;
      } else {
        mapState.panX += dx;
        mapState.panY += dy;
      }
      return;
    }
    const hit = pickNode(e.clientX, e.clientY);
    mapState.hoveredId = hit ? hit.key : null;
    canvas.style.cursor = hit ? 'pointer' : 'grab';
  });
  canvas.addEventListener('pointerup', (e) => {
    mapState.dragging = false;
    if (!mapState.dragMoved) {
      const hit = pickNode(e.clientX, e.clientY);
      if (hit) selectStar(hit.key, false);
      else closeInspector();
    }
  });
  canvas.addEventListener('dblclick', () => resetCamera());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.91 : 1.1;
    mapState.zoom = Math.max(0.45, Math.min(2.8, mapState.zoom * factor));
  }, { passive: false });
}

function selectStar(key, smoothFocus = false) {
  const n = mapState.nodeByKey.get(String(key));
  if (!n) return;
  mapState.selectedId = n.key;
  if (smoothFocus && mapState.mode === '3d') {
    const r = Math.hypot(n.x3, n.z3);
    if (r > 5) {
      mapState.targetRotY = Math.atan2(n.x3, n.z3);
      mapState.targetRotX = Math.max(-0.85, Math.min(0.85, -n.y3 / 240));
    }
  }
  renderNodeDrawer();
  renderInspector(n);
}

function closeInspector() {
  mapState.selectedId = null;
  document.getElementById('star-inspector').classList.remove('open');
  renderNodeDrawer();
}

function renderInspector(n) {
  const insp = document.getElementById('star-inspector');
  const head = document.getElementById('insp-title-badges');
  const body = document.getElementById('insp-body');
  const meta = CAT_META[n.category] || CAT_META.fact;

  insp.classList.add('open');

  // Connected neighbors
  const related = [];
  for (const e of mapState.edges) {
    if (e.source === n.key) {
      const other = mapState.nodeByKey.get(e.target);
      if (other) related.push({ node: other, reason: e.reason, weight: e.weight });
    } else if (e.target === n.key) {
      const other = mapState.nodeByKey.get(e.source);
      if (other) related.push({ node: other, reason: e.reason, weight: e.weight });
    }
  }
  related.sort((a, b) => b.weight - a.weight);

  if (n.kind === 'topic') {
    head.innerHTML = `<span class="badge" style="color:${meta.color};border-color:${meta.color}55;">✦ 主题星团</span><strong style="font-size:13px;">${esc(n.label)}</strong>`;
    body.innerHTML = `
      <div class="insp-content">该主题/标签共关联了 <strong>${related.length}</strong> 颗记忆星辰，点击下方节点即可跳转查看详情。</div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);">关联记忆星辰 (${related.length})</div>
      ${related.map((r) => `
        <div class="neighbor-chip" onclick="selectStar('${r.node.key}', true)">
          <div style="font-weight:600;">${esc(r.node.label)}</div>
          <div style="font-size:10.5px;color:var(--muted);">#${r.node.id} · ${esc(r.reason)}</div>
        </div>
      `).join('')}
    `;
    return;
  }

  head.innerHTML = `
    <span class="badge" style="color:${meta.color};border-color:${meta.color}55;">
      <span class="status-dot" style="background:${meta.color};"></span>${meta.label}
    </span>
    <span class="badge">#${n.id}</span>
    ${n.is_hub ? '<span class="badge" style="color:#fbbf24;border-color:#fbbf2455;">☀️ 核心恒星</span>' : ''}
  `;

  const fCol = freshColor(n.freshness_pct);
  body.innerHTML = `
    <div class="insp-content">${esc(n.content)}</div>

    <div>
      <div class="row-flex" style="font-size:11.5px;margin-bottom:4px;">
        <span style="color:var(--muted);">鲜活度</span>
        <strong style="color:${fCol};">${n.freshness_pct}%</strong>
        <div class="spacer"></div>
        <span style="color:var(--muted);">半衰期 <strong>${n.half_life_days} 天</strong> · 重要度 <strong>${n.importance}/5</strong></span>
      </div>
      <div class="fresh-track"><div class="fresh-fill" style="width:${n.freshness_pct}%;background:${fCol};"></div></div>
    </div>

    <div class="row-flex" style="font-size:11px;color:var(--muted);">
      <span>创建：${esc(n.time_label)}</span>
      <span>·</span>
      <span>召回：${n.recall_count || 0} 次</span>
      ${n.workspace ? `<span>· 工作区：${esc(n.workspace)}</span>` : ''}
    </div>

    ${n.tags ? `<div class="row-flex">${n.tags.split(/[,，]+/).filter(Boolean).map((tg) => `<span class="badge"># ${esc(tg.trim())}</span>`).join('')}</div>` : ''}

    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:5px;">快捷调整半衰期：</div>
      <div class="row-flex">
        ${[14, 30, 60, 90, 180, 365].map((d) => `<button class="btn btn-sm ${Number(n.half_life_days) === d ? 'active-toggle' : ''}" onclick="updateHalfLife(${n.id}, ${d})">${d}天</button>`).join('')}
      </div>
    </div>

    <div class="row-flex" style="padding-top:4px;border-top:1px solid var(--border);">
      <button class="btn btn-sm" onclick="openEditModal(${n.id})">✏️ 编辑</button>
      <button class="btn btn-sm" onclick="toggleArchive(${n.id}, ${!n.archived})">${n.archived ? '♻️ 恢复' : '📦 归档'}</button>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-danger" onclick="hardDelete(${n.id})">🗑️ 删除</button>
    </div>

    ${related.length > 0 ? `
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;">关联星辰 (${related.length})</div>
      ${related.slice(0, 8).map((r) => `
        <div class="neighbor-chip" onclick="selectStar('${r.node.key}', true)">
          <div style="font-weight:600;">${r.node.kind === 'topic' ? '✦ ' : ''}${esc(r.node.label)}</div>
          <div style="font-size:10.5px;color:var(--muted);">${esc(r.reason)}</div>
        </div>
      `).join('')}
    ` : ''}
  `;
}

function setHl(days) { document.getElementById('new-hl').value = days; }

function toggleAddDrawer() {

function toggleIoCard() {

function renderCard(m, extraHtml = '') {
  const meta = CAT_META[m.category] || CAT_META.fact;
  const fCol = freshColor(m.freshness_pct);
  const tagsHtml = (m.tags || '').split(/[,，]+/).map((s) => s.trim()).filter(Boolean)
    .map((tg) => `<span class="badge">#${esc(tg)}</span>`).join('');
  return `
    <div class="mem-card ${m.archived ? 'archived' : ''}">
      <div class="mem-top">
        <div class="mem-badges">
          <span class="badge">#${m.id}</span>
          <span class="badge" style="color:${meta.color};border-color:${meta.color}55;">
            <span class="status-dot" style="background:${meta.color};"></span>${meta.label}
          </span>
          <span class="badge" style="color:${fCol};">鲜活 ${m.freshness_pct}%</span>
          <span class="badge">半衰期 ${m.half_life_days}天</span>
          <span class="badge">重要度 ${m.importance}/5</span>
          ${m.archived ? '<span class="badge" style="color:var(--warn);">已归档</span>' : ''}
          ${extraHtml}
        </div>
        <div class="row-flex">
          ${!m.archived ? `<button class="btn btn-sm" onclick="focusInMap(${m.id})">🌌 星图定位</button>` : ''}

          <button class="btn btn-sm" onclick="toggleArchive(${m.id}, ${!m.archived})">${m.archived ? '♻️ 恢复' : '📦 归档'}</button>
          <button class="btn btn-sm btn-danger" onclick="hardDelete(${m.id})">🗑️</button>
        </div>
      </div>
      <div class="mem-content">${esc(m.content)}</div>
      <div class="mem-foot">
        <div class="row-flex">
          <span>创建：${esc(m.time_label)}</span>
          <span>·</span>
          <span>最近唤醒：${esc(m.last_recalled_label)}</span>
          <span>·</span>
          <span>召回 ${m.recall_count || 0} 次</span>

        </div>
        <div class="row-flex">${tagsHtml}</div>
      </div>
    </div>
  `;
}

async function loadStats() {
  cachedStats = await api('/api/stats');
  updateMapHudCounts();
}

async function loadGraph() {
  const data = await api('/api/graph');
  mapState.rawNodes = data.nodes || [];
  mapState.rawEdges = data.edges || [];
  mapState.rawTopics = data.topics || [];
  mapState.rawTopicEdges = data.topic_edges || [];
  if (data.stats) cachedStats = data.stats;
  rebuildStarField();
  if (mapState.selectedId && mapState.nodeByKey.has(mapState.selectedId)) {
    renderInspector(mapState.nodeByKey.get(mapState.selectedId));
  }
}

async function loadList() {
  const params = new URLSearchParams({
    status: document.getElementById('filter-status').value,
    category: document.getElementById('filter-category').value,
    workspace: document.getElementById('filter-workspace').value.trim(),
    search: document.getElementById('filter-search').value.trim(),
    sort: document.getElementById('filter-sort').value,
    limit: '300'
  });
  const data = await api(`/api/memories?${params.toString()}`);
  cachedMemories = data.items || [];
  document.getElementById('list-count').textContent = cachedMemories.length;
  const el = document.getElementById('memory-list');
  if (cachedMemories.length === 0) {
    el.innerHTML = '<div class="empty-state">当前筛选条件下没有记忆 🐾</div>';
    return;
  }
  el.innerHTML = cachedMemories.map((m) => renderCard(m)).join('');
}

async function addMemory() {
  const content = document.getElementById('new-content').value.trim();
  if (!content) return toast('请先输入记忆内容');
  const res = await api('/api/memories', {
    method: 'POST',
    body: JSON.stringify({
      content,
      category: document.getElementById('new-category').value,
      tags: document.getElementById('new-tags').value.trim(),
      workspace: document.getElementById('new-workspace').value.trim(),
      importance: Number(document.getElementById('new-importance').value),
      half_life_days: Number(document.getElementById('new-hl').value)
    })
  });
  document.getElementById('new-content').value = '';
  document.getElementById('new-tags').value = '';
  toast(res.action === 'created' ? `已保存新记忆 #${res.memory.id} 🐾` : `已自动合并更新记忆 #${res.memory.id}`);
  await refreshAll();
}

function openEditModal(id) {
  const m = cachedMemories.find((x) => x.id === id) || mapState.rawNodes.find((x) => x.id === id);
  if (!m) return;
  document.getElementById('edit-id').value = m.id;
  document.getElementById('edit-id-label').textContent = `#${m.id}`;
  document.getElementById('edit-content').value = m.content || '';
  document.getElementById('edit-category').value = m.category || 'fact';
  document.getElementById('edit-importance').value = String(m.importance || 3);
  document.getElementById('edit-hl').value = m.half_life_days || 30;
  document.getElementById('edit-tags').value = m.tags || '';
  document.getElementById('edit-workspace').value = m.workspace || '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
}

async function saveMemoryEdit() {
  const id = Number(document.getElementById('edit-id').value);
  const content = document.getElementById('edit-content').value.trim();
  if (!content) return toast('记忆内容不能为空');
  await api('/api/update', {
    method: 'POST',
    body: JSON.stringify({
      id,
      content,
      category: document.getElementById('edit-category').value,
      importance: Number(document.getElementById('edit-importance').value),
      half_life_days: Number(document.getElementById('edit-hl').value),
      tags: document.getElementById('edit-tags').value.trim(),
      workspace: document.getElementById('edit-workspace').value.trim()
    })
  });
  closeEditModal();
  toast(`已更新记忆 #${id} ✨`);
  await refreshAll();
}

async function updateHalfLife(id, days) {
  await api('/api/update', { method: 'POST', body: JSON.stringify({ id, half_life_days: days }) });
  toast(`已将记忆 #${id} 半衰期调整为 ${days} 天`);
  await refreshAll();
}

async function toggleArchive(id, archived) {
  await api('/api/archive', { method: 'POST', body: JSON.stringify({ id, archived }) });
  toast(archived ? `已归档记忆 #${id}` : `已恢复记忆 #${id}`);
  if (archived && mapState.selectedId === String(id)) closeInspector();
  await refreshAll();
}

async function hardDelete(id) {
  if (!confirm(`确定要永久删除记忆 #${id} 吗？此操作无法撤销。`)) return;
  await api('/api/delete', { method: 'POST', body: JSON.stringify({ id }) });
  toast(`已永久删除记忆 #${id}`);
  if (mapState.selectedId === String(id)) closeInspector();
  await refreshAll();
}

function focusInMap(id) {
  switchTab('map');
  setTimeout(() => {
    resizeCanvas();
    selectStar(String(id), true);
  }, 50);
}

/* ==================== EXPORT & IMPORT WORKFLOW ==================== */
const importDraft = {
  filename: '',
  content: '',
  preview: null
};

async function exportAllMemories() {
  try {
    const format = document.getElementById('export-format').value;
    const res = await api(`/api/export?format=${encodeURIComponent(format)}&include_archived=1`);
    const blob = new Blob([res.content], { type: res.mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(`已导出全部 ${res.count} 条记忆 (${res.format.toUpperCase()}) 📥`);
  } catch (e) {
    toast(`导出失败：${e.message}`);
  }
}

function triggerImportPicker() {
  const input = document.getElementById('import-file-input');
  input.value = '';
  input.click();
}

function handleImportFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  readAndPreviewImportFile(file);
}

function readAndPreviewImportFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    importDraft.filename = file.name;
    importDraft.content = String(reader.result || '');
    const strategy = document.getElementById('import-strategy').value;
    document.getElementById('modal-import-strategy').value = strategy;
    await refreshImportPreview(true);
  };
  reader.onerror = () => toast('读取文件失败');
  reader.readAsText(file, 'utf-8');
}

async function refreshImportPreview(openModal = false) {
  try {
    const strategy = document.getElementById('modal-import-strategy').value;
    document.getElementById('import-strategy').value = strategy;
    const preview = await api('/api/import/preview', {
      method: 'POST',
      body: JSON.stringify({
        filename: importDraft.filename,
        content: importDraft.content,
        duplicate_strategy: strategy
      })
    });
    importDraft.preview = preview;
    renderImportPreviewModal(preview);
    if (openModal) document.getElementById('import-modal').classList.add('open');
  } catch (e) {
    toast(`解析导入文件失败：${e.message}`);
  }
}

function renderImportPreviewModal(p) {
  document.getElementById('imp-meta-file').textContent = `📄 ${p.filename || '未命名文件'}`;
  document.getElementById('imp-meta-format').textContent = `格式：${String(p.format || '').toUpperCase()}`;

  const summaryEl = document.getElementById('imp-summary-badges');
  summaryEl.innerHTML = `
    <span class="badge">共解析 ${p.total} 条</span>
    <span class="badge act-create">将新增 ${p.planned.create} 条</span>
    ${p.planned.overwrite > 0 ? `<span class="badge act-overwrite">将覆盖 ${p.planned.overwrite} 条</span>` : ''}
    ${p.planned.skip > 0 ? `<span class="badge act-skip">将跳过重复 ${p.planned.skip} 条</span>` : ''}
    ${p.invalid_count > 0 ? `<span class="badge" style="color:var(--danger);">忽略无效行 ${p.invalid_count}</span>` : ''}
  `;

  const warnEl = document.getElementById('imp-warnings');
  if (p.warnings && p.warnings.length > 0) {
    warnEl.style.display = 'block';
    warnEl.textContent = '提示：' + p.warnings.join('；');
  } else {
    warnEl.style.display = 'none';
  }

  const tbody = document.getElementById('imp-preview-tbody');
  const actionLabel = { create: '新增', overwrite: '覆盖', skip: '跳过' };
  const actionCls = { create: 'act-create', overwrite: 'act-overwrite', skip: 'act-skip' };
  tbody.innerHTML = (p.items || []).slice(0, 120).map((it) => {
    const meta = CAT_META[it.category] || CAT_META.fact;
    const snippet = it.content.length > 96 ? it.content.slice(0, 96) + '…' : it.content;
    return `<tr>
      <td><span class="badge ${actionCls[it.planned_action]}">${actionLabel[it.planned_action]}</span></td>
      <td><span class="badge" style="color:${meta.color};">${meta.label}</span></td>
      <td>
        <div>${esc(snippet)}</div>
        ${it.matched_id ? `<div style="font-size:10.5px;color:var(--muted);">匹配已有记忆 #${it.matched_id} (${it.match_type === 'exact' ? '完全一致' : '高度相似'})</div>` : ''}
      </td>
      <td style="color:var(--muted);">${it.half_life_days}天</td>
    </tr>`;
  }).join('');

  if ((p.items || []).length > 120) {
    tbody.innerHTML += `<tr><td colspan="4" style="text-align:center;color:var(--muted);">仅展示前 120 条预览，确认后将导入全部 ${p.total} 条。</td></tr>`;
  }

  const willApply = p.planned.create + p.planned.overwrite;
  const btn = document.getElementById('btn-confirm-import');
  btn.disabled = willApply === 0;
  btn.textContent = willApply > 0 ? `✅ 确认导入 (${willApply} 条生效)` : '没有可写入的新记忆';
}

function closeImportModal() {
  document.getElementById('import-modal').classList.remove('open');
}

async function commitImport() {
  try {
    const strategy = document.getElementById('modal-import-strategy').value;
    const res = await api('/api/import/commit', {
      method: 'POST',
      body: JSON.stringify({
        filename: importDraft.filename,
        content: importDraft.content,
        duplicate_strategy: strategy
      })
    });
    closeImportModal();
    toast(`导入完成！新增 ${res.created} 条，更新 ${res.updated} 条，跳过 ${res.skipped} 条 ✨`);
    await refreshAll();
  } catch (e) {
    toast(`导入失败：${e.message}`);
  }
}

function bindImportDragDrop() {
  const zone = document.getElementById('import-drop-zone');
  ['dragenter', 'dragover'].forEach((ev) => {
    zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach((ev) => {
    zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove('dragover'); });
  });
  zone.addEventListener('drop', (e) => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) readAndPreviewImportFile(file);
  });
}

/* ==================== RECALL LAB & LOGS ==================== */
async function runRecall() {
  const q = document.getElementById('recall-query').value.trim();
  if (!q) return toast('请输入检索词');
  const data = await api('/api/recall', { method: 'POST', body: JSON.stringify({ query: q, limit: 10 }) });
  const el = document.getElementById('recall-results');
  if (!data.items || data.items.length === 0) {
    el.innerHTML = '<div class="empty-state">没有命中相关记忆（说明不会浪费上下文注入无关内容 ✨）</div>';
    return;
  }
  el.innerHTML = data.items.map((m) =>
    renderCard(m, `<span class="badge" style="color:var(--accent);">综合分 ${m.score} · 证据 ${m.evidence}</span>`)
  ).join('');
}

async function loadLogs() {
  const data = await api('/api/logs?limit=50');
  const el = document.getElementById('logs-list');
  if (!data.items || data.items.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无召回记录</div>';
    return;
  }
  el.innerHTML = data.items.map((l) => `
    <div class="mem-card">
      <div class="mem-top">
        <div class="mem-badges">
          <span class="badge">查询：${esc(l.query)}</span>
          <span class="badge" style="color:var(--accent);">得分 ${Number(l.score || 0).toFixed(3)}</span>
          <span class="badge">#${l.memory_id}</span>
        </div>
        <span style="font-size:11px;color:var(--muted);">${esc(l.time_label)}</span>
      </div>
      <div class="mem-content" style="font-size:12.5px;">${esc(l.content || '（原记忆已删除）')}</div>
    </div>
  `).join('');
}

async function refreshAll() {
  await Promise.all([loadStats(), loadGraph(), loadList()]);
}

// Boot
initSprites();
initBgStars();
setTheme(currentTheme);
bindCanvasEvents();
bindImportDragDrop();
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
refreshAll();
if (location.hash === '#list') switchTab('list');
else if (location.hash === '#recall') switchTab('recall');
else if (location.hash === '#logs') switchTab('logs');
requestAnimationFrame(renderStarMap);
</script>
